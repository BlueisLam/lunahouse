<body data-page="track">
<header id="top"></header>
<main>
<div class="wrap">
  <div class="page-title"><h1>Tra cứu hồ sơ</h1><p>Nhập mã hồ sơ trong email xác nhận và email hoặc số điện thoại bạn đã dùng khi nộp.</p></div>
  <form class="panel" id="tf" novalidate>
    <div id="terr" role="alert" class="alert err hide"></div>
    <div class="field"><label for="t-code">Mã hồ sơ</label><input class="in mono" id="t-code" name="code" placeholder="LH-XXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14" style="letter-spacing:.08em;text-transform:uppercase"></div>
    <div class="field"><label for="t-contact">Email hoặc số điện thoại</label><input class="in" id="t-contact" name="contact" autocomplete="email" inputmode="email" maxlength="120"><span class="help">Dùng đúng thông tin bạn đã nhập khi nộp hồ sơ.</span></div>
    <button class="btn block" type="submit" id="tsub">Tra cứu</button>
  </form>
  <div id="out" style="margin-top:8px"></div>
</div>
</main>
<footer id="foot"></footer>
</body>
</html>
